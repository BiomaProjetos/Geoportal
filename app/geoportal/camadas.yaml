# Catálogo de camadas do Geoportal Bioma
#
# Cada camada de referência vira a tabela bases.<slug> quando é importada:
#   geoportal importar-base <slug> <arquivo .shp/.zip/.gpkg>
#
# papel = como a camada entra na triagem:
#   embargo          sobreposição = alerta crítico + serviço "Desembargo"
#   desmate          PRODES: separa antes/depois do marco pelo campo de ano
#   alerta           DETER, MapBiomas Alerta: alerta de atenção
#   uso_consolidado  base de uso consolidado da SEMA-MT
#   fitofisionomia   RADAM: define o percentual de Reserva Legal
#   georref          SIGEF / SNCI: compara a área certificada com a do CAR
#   outro_car        sobreposição com outro CAR
#   custeio          glebas do Sicor (crédito rural)
#   protegida        TI, UC, assentamento etc. (nivel: critico ou atencao)
#   info             só aparece no mapa e na lista de sobreposições
#
# Os nomes de campo (campo_ano, campo_fito, campo_codigo...) variam de base para base.
# Confira no QGIS (tabela de atributos) e ajuste aqui antes de importar.

marco_legal: "2008-07-22"
ano_prodes_pos_marco: 2009     # PRODES 2009 em diante = supressão depois de 22/07/2008

percentual_rl:                 # regra pela fitofisionomia do RADAM (Amazônia Legal)
  - contem: ["FLORESTA", "FLORESTAL"]
    pct: 80
    texto: "80% — floresta na Amazônia Legal"
  - contem: ["CAMPINARANA", "CAMPOS GERAIS", "CAMPO"]
    pct: 20
    texto: "20% — campos gerais na Amazônia Legal"
  - contem: ["SAVANA", "CERRADO"]
    pct: 35
    texto: "35% — cerrado na Amazônia Legal"

# Como reconhecer, pelo nome do arquivo dentro do zip exportado do Simcar/Geoportal SEMA,
# cada camada do próprio imóvel. A primeira regra que casar vale.
imovel_tipos:
  - tipo: ATP
    nome: Perímetro do CAR
    nomes_arquivo: ["ATP", "AREA_IMOVEL", "PERIMETRO", "REQUERIMENTO"]
  - tipo: APP
    nome: APP
    nomes_arquivo: ["APP"]
  - tipo: ARL
    nome: Reserva Legal (ARL)
    nomes_arquivo: ["ARL", "RESERVA"]
  - tipo: AVN
    nome: Vegetação nativa (AVN)
    nomes_arquivo: ["AVN", "VEGETACAO"]
  - tipo: AC
    nome: Área consolidada declarada
    nomes_arquivo: ["CONSOLIDADA", "_AC", "AREA_CONS"]
  - tipo: AUAS
    nome: AUAS
    nomes_arquivo: ["AUAS"]
  - tipo: HIDRO
    nome: Hidrografia
    nomes_arquivo: ["RIO", "HIDRO", "CURSO", "NASCENTE", "LAGOA", "MASSA"]

fundos:                        # imagens de fundo do mapa
  - nome: Sentinel-2 sem nuvens 2016 (EOX)
    url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{z}/{y}/{x}.jpg"
    atribuicao: "Sentinel-2 cloudless 2016 por EOX IT Services GmbH (dados Copernicus 2016), CC BY 4.0"
    max_zoom: 16
  - nome: OpenStreetMap
    url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    atribuicao: "© colaboradores do OpenStreetMap"
    max_zoom: 19

