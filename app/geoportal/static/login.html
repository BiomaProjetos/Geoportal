<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2616">
<title>Entrar · Geoportal Bioma</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
  body{min-height:100%;display:grid;place-items:center;background:var(--side-bg);padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
  .caixa{width:min(400px,100%);background:var(--card);border-radius:20px;padding:30px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px #0007}
  .marca{display:flex;align-items:center;gap:12px}
  .marca b{font-family:var(--display);font-weight:800;font-size:20px;color:var(--fg)} .marca b span{color:var(--brand)}
  .marca small{display:block;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .caixa .btn{justify-content:center;padding:12px;font-size:14px;border-radius:12px}
</style>
</head>
<body>
<form class="caixa" id="f">
  <div class="marca"><img src="/icone.svg" width="46" height="46" alt=""><div><b>RADAR <span>BIOMA</span></b><small>Geoportal interno</small></div></div>
  <label class="fld">E-mail<input id="email" type="email" autocomplete="username" required></label>
  <label class="fld">Senha<input id="senha" type="password" autocomplete="current-password" required></label>
  <span class="erro" id="erro" role="alert"></span>
  <button class="btn primary" type="submit" id="b">Entrar</button>
  <p class="note" style="margin:0">Acesso restrito à equipe da Bioma Soluções Agroambientais.</p>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const b = document.getElementById("b"), er = document.getElementById("erro");
  b.disabled = true; er.textContent = "";
  try {
    const r = await fetch("/api/login", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email: document.getElementById("email").value, senha: document.getElementById("senha").value})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.erro || "Não foi possível entrar.");
    location.href = "/";
  } catch (x) { er.textContent = x.message; } finally { b.disabled = false; }
});
</script>
</body>
</html>
